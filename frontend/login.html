<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupportPilot – Login</title>
  <meta name="description" content="Sign in to SupportPilot, the AI-powered intelligent support management platform. Access your workspace as an Employee or Admin." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-app: #f0f4ff;
      --bg-card: rgba(255, 255, 255, 0.95);
      --bg-input: #ffffff;
      --bg-role-card: #f8faff;
      --bg-role-card-hover: #eef3ff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent2: #7c3aed;
      --accent-hover: #4338ca;
      --accent-light: rgba(79, 70, 229, 0.10);
      --accent-glow: rgba(79, 70, 229, 0.22);
      --danger: #ef4444;
      --danger-light: rgba(239, 68, 68, 0.10);
      --success: #10b981;
      --success-light: rgba(16, 185, 129, 0.12);
      --border: rgba(226, 232, 240, 1);
      --border-role: rgba(209, 213, 219, 0.8);
      --shadow-card: 0 24px 64px -12px rgba(79, 70, 229, 0.12), 0 4px 20px rgba(0,0,0,0.06);
      --shadow-role: 0 2px 12px rgba(0,0,0,0.06);
      --shadow-btn: 0 4px 18px rgba(79, 70, 229, 0.40);
      --radius: 20px;
      --radius-sm: 12px;
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg-app: #07090f;
      --bg-card: rgba(13, 18, 35, 0.96);
      --bg-input: #131929;
      --bg-role-card: #111827;
      --bg-role-card-hover: #1a2540;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #4b5563;
      --accent: #6366f1;
      --accent2: #8b5cf6;
      --accent-hover: #4f46e5;
      --accent-light: rgba(99, 102, 241, 0.15);
      --accent-glow: rgba(99, 102, 241, 0.30);
      --border: rgba(30, 41, 59, 1);
      --border-role: rgba(51, 65, 85, 0.9);
      --shadow-card: 0 25px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(99,102,241,0.08);
      --shadow-role: 0 2px 12px rgba(0,0,0,0.25);
      --shadow-btn: 0 4px 18px rgba(99, 102, 241, 0.45);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body, #root {
      height: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      transition: background var(--transition), color var(--transition);
      -webkit-font-smoothing: antialiased;
    }

    .page-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
      position: relative;
    }

    @media (min-width: 920px) {
      .page-layout { grid-template-columns: 45% 55%; }
    }

    /* LEFT PANEL */
    .left-panel {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 52px 56px;
      background: linear-gradient(145deg, #4f46e5 0%, #6366f1 55%, #7c3aed 100%);
      position: relative;
      overflow: hidden;
      min-height: 100vh;
    }

    [data-theme="dark"] .left-panel {
      background: linear-gradient(145deg, #312e81 0%, #4338ca 55%, #5b21b6 100%);
    }

    @media (min-width: 920px) { .left-panel { display: flex; } }

    .left-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(139,92,246,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(99,102,241,0.25) 0%, transparent 55%);
      pointer-events: none;
    }

    .left-panel::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .left-content { position: relative; z-index: 10; }
    .left-footer { position: relative; z-index: 10; }

    .left-logo {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 60px;
      animation: slideInLeft 0.6s 0.1s ease-out both;
    }

    .logo-cube {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.20);
      border: 1.5px solid rgba(255,255,255,0.30);
      border-radius: 10px;
      backdrop-filter: blur(8px);
      display: grid; place-items: center; flex-shrink: 0;
    }

    .logo-cube svg { width: 22px; height: 22px; color: white; }
    .logo-name { font-size: 22px; font-weight: 800; color: white; letter-spacing: -0.3px; }

    .left-heading {
      font-size: clamp(42px, 5vw, 56px); font-weight: 800;
      color: white; line-height: 1.1; letter-spacing: -1.5px;
      margin-bottom: 16px;
      animation: slideInLeft 0.6s 0.2s ease-out both;
    }

    .left-tagline {
      font-size: 16px; font-weight: 500;
      color: rgba(255,255,255,0.80);
      line-height: 1.6; margin-bottom: 44px; max-width: 320px;
      animation: slideInLeft 0.6s 0.3s ease-out both;
    }

    .feature-list {
      display: flex; flex-direction: column; gap: 18px;
      animation: slideInLeft 0.6s 0.4s ease-out both;
    }

    .feature-item { display: flex; align-items: flex-start; gap: 14px; }

    .feature-icon {
      width: 38px; height: 38px; border-radius: 10px;
      background: rgba(255,255,255,0.13);
      border: 1px solid rgba(255,255,255,0.18);
      display: grid; place-items: center; flex-shrink: 0;
      backdrop-filter: blur(4px);
    }

    .feature-icon svg { width: 18px; height: 18px; color: rgba(255,255,255,0.9); }

    .feature-text h4 { font-size: 14px; font-weight: 700; color: white; margin-bottom: 3px; }
    .feature-text p { font-size: 12.5px; color: rgba(255,255,255,0.65); line-height: 1.5; }

    .ai-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px; padding: 10px 18px;
      backdrop-filter: blur(8px);
      animation: slideInLeft 0.6s 0.5s ease-out both;
    }

    .ai-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #4ade80; box-shadow: 0 0 8px #4ade80;
      animation: pulseGreen 2s ease-in-out infinite;
    }

    @keyframes pulseGreen {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    .ai-badge span { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.85); }

    .left-orb-1 {
      position: absolute; width: 300px; height: 300px; border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,0.4) 0%, transparent 65%);
      bottom: -60px; right: -80px; pointer-events: none;
      animation: orbFloat 7s ease-in-out infinite;
    }

    .left-orb-2 {
      position: absolute; width: 180px; height: 180px; border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.35) 0%, transparent 65%);
      top: 60px; right: 30px; pointer-events: none;
      animation: orbFloat 9s ease-in-out infinite reverse;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-24px) scale(1.05); }
    }

    /* RIGHT PANEL */
    .right-panel {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px;
      background: var(--bg-app);
      transition: background var(--transition);
      min-height: 100vh;
    }

    .mobile-brand {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px;
      animation: fadeDown 0.5s ease both;
    }

    @media (min-width: 920px) { .mobile-brand { display: none; } }

    .mobile-logo-cube {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: grid; place-items: center;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .mobile-logo-cube svg { width: 18px; height: 18px; color: white; }

    .mobile-brand-name {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .auth-wrapper { width: 100%; max-width: 440px; }

    /* CARD */
    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      padding: 36px 32px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
      animation: fadeUp 0.45s ease both;
    }

    @media (max-width: 480px) { .card { padding: 28px 22px; } }

    .card-header { text-align: center; margin-bottom: 28px; }

    .card-title {
      font-size: 20px; font-weight: 800;
      color: var(--text-primary); letter-spacing: -0.4px; margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13.5px; color: var(--text-secondary);
      font-weight: 500; line-height: 1.5;
    }

    /* ROLE GRID */
    .role-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }

    .role-card {
      background: var(--bg-role-card);
      border: 2px solid var(--border-role);
      border-radius: 16px; padding: 20px 14px 18px;
      cursor: pointer; text-align: center;
      transition: all 0.22s cubic-bezier(0.4,0,0.2,1);
      position: relative; outline: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
    }

    .role-card:hover {
      background: var(--bg-role-card-hover);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }

    .role-card.selected {
      border-color: var(--accent);
      background: var(--accent-light);
      box-shadow: 0 0 0 1px var(--accent), 0 8px 28px var(--accent-glow);
    }

    .role-check {
      position: absolute; top: 10px; right: 10px;
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent); display: grid; place-items: center;
      opacity: 0; transform: scale(0.5);
      transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
    }

    .role-check.show { opacity: 1; transform: scale(1); }
    .role-check svg { width: 12px; height: 12px; color: white; }

    .role-icon-wrap {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--accent-light);
      display: grid; place-items: center;
      margin: 0 auto 12px;
      transition: all 0.22s ease;
    }

    .role-card:hover .role-icon-wrap,
    .role-card.selected .role-icon-wrap {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 18px var(--accent-glow);
    }

    .role-icon-wrap svg { width: 24px; height: 24px; color: var(--accent); transition: color 0.22s; }
    .role-card:hover .role-icon-wrap svg,
    .role-card.selected .role-icon-wrap svg { color: white; }

    .role-title { font-size: 13.5px; font-weight: 700; color: var(--text-primary); margin-bottom: 5px; }
    .role-desc { font-size: 11.5px; color: var(--text-secondary); line-height: 1.5; }

    /* DIVIDER */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-muted);
      font-size: 12px; font-weight: 500;
    }

    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }

    /* FORM */
    .form-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }

    .form-title { font-size: 17px; font-weight: 800; color: var(--text-primary); letter-spacing: -0.3px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none;
      font-size: 13px; font-weight: 600;
      color: var(--accent); cursor: pointer;
      padding: 5px 0; font-family: inherit;
      transition: opacity var(--transition);
    }

    .back-btn:hover { opacity: 0.75; }
    .back-btn svg { width: 14px; height: 14px; }

    .form-group { margin-bottom: 16px; position: relative; }
    .input-wrapper { position: relative; display: flex; align-items: center; }

    .input-icon {
      position: absolute; left: 14px;
      color: var(--text-muted); pointer-events: none; display: flex;
      transition: color var(--transition);
    }

    .input-icon svg { width: 16px; height: 16px; }

    .form-input {
      width: 100%; padding: 12.5px 14px 12.5px 42px;
      font-size: 13.5px; font-family: inherit; font-weight: 500;
      background: var(--bg-input); color: var(--text-primary);
      border: 1.5px solid var(--border); border-radius: 12px;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
      caret-color: var(--accent);
    }

    .form-input::placeholder { color: var(--text-muted); font-weight: 400; }

    .form-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .input-wrapper:focus-within .input-icon { color: var(--accent); }

    .pw-toggle {
      position: absolute; right: 13px;
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); display: flex; align-items: center;
      padding: 4px; transition: color var(--transition); border-radius: 6px;
    }

    .pw-toggle:hover { color: var(--accent); }
    .pw-toggle svg { width: 16px; height: 16px; }

    .forgot-row { display: flex; justify-content: flex-end; margin-bottom: 6px; }

    .link-btn {
      background: none; border: none; color: var(--accent);
      font-size: 12.5px; font-weight: 600; cursor: pointer;
      padding: 0; font-family: inherit; transition: opacity var(--transition);
    }

    .link-btn:hover { opacity: 0.75; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px 20px;
      font-size: 14px; font-family: inherit; font-weight: 700;
      border-radius: 12px; border: none; cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
      letter-spacing: 0.02em;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      color: #fff; box-shadow: var(--shadow-btn); margin-top: 8px;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1.5px);
      box-shadow: 0 8px 28px var(--accent-glow);
    }

    .signup-row {
      text-align: center; margin-top: 18px;
      font-size: 13px; color: var(--text-secondary); font-weight: 500;
    }

    .signup-row .link-btn { font-size: 13px; margin-left: 4px; }

    .security-badge {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--text-muted); font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    .security-badge svg { width: 14px; height: 14px; }

    .msg {
      display: flex; align-items: center; gap: 8px;
      padding: 11px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 500; margin-bottom: 16px;
    }

    .msg-error { background: var(--danger-light); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); }
    .msg svg { width: 15px; height: 15px; flex-shrink: 0; }

    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.35);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    /* THEME TOGGLE */
    .theme-toggle-wrap {
      position: fixed; top: 20px; right: 20px; z-index: 200;
      animation: fadeDown 0.4s 0.2s ease both;
    }

    .theme-toggle {
      display: flex; align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px; padding: 4px; gap: 2px;
      backdrop-filter: blur(16px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
      transition: background var(--transition), border-color var(--transition);
    }

    .theme-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 999px;
      border: none; background: none;
      font-size: 12.5px; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      font-family: inherit; transition: all 0.18s ease;
    }

    .theme-btn svg { width: 14px; height: 14px; }

    .theme-btn.active {
      background: var(--bg-app);
      color: var(--text-primary);
      box-shadow: 0 1px 6px rgba(0,0,0,0.10);
    }

    [data-theme="dark"] .theme-btn.active {
      background: rgba(99,102,241,0.18);
      color: var(--accent);
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-28px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(18px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .anim-slide-in { animation: slideIn 0.28s cubic-bezier(0.4, 0, 0.2, 1) both; }
    .anim-fade-in { animation: fadeIn 0.25s ease both; }

    *:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-role); border-radius: 99px; }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const IconCube = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>

    const IconUser = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>

    const IconShield = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    );

    const IconMail = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <rect x="2" y="4" width="20" height="16" rx="2"/>
        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
      </svg>
    );

    const IconLock = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    );

    const IconEye = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
      </svg>
    );

    const IconEyeOff = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
        <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
        <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
        <line x1="2" y1="2" x2="22" y2="22"/>
      </svg>
    );

    const IconCheck = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    );

    const IconArrowLeft = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
    );

    const IconSun = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
      </svg>
    );

    const IconMoon = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    );

    const IconAlertCircle = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const IconMessageSquare = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    );

    const IconBarChart = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
    );

    const IconUsers = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
    );

    const IconShieldCheck = () => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>
      </svg>
    );

    function ThemeToggle({ theme, onToggle }) {
      return (
        <div className="theme-toggle-wrap">
          <div className="theme-toggle">
            <button className={`theme-btn ${theme === 'light' ? 'active' : ''}`} onClick={() => onToggle('light')} aria-label="Light mode">
              <IconSun /> Light
            </button>
            <button className={`theme-btn ${theme === 'dark' ? 'active' : ''}`} onClick={() => onToggle('dark')} aria-label="Dark mode">
              <IconMoon /> Dark
            </button>
          </div>
        </div>
      );
    }

    function LeftPanel() {
      return (
        <div className="left-panel">
          <div className="left-orb-1" />
          <div className="left-orb-2" />
          <div className="left-content">
            <div className="left-logo">
              <div className="logo-cube"><IconCube /></div>
              <span className="logo-name">SupportPilot</span>
            </div>
            <h1 className="left-heading">Hey, Hello!</h1>
            <p className="left-tagline">Your intelligent support management platform.</p>
            <div className="feature-list">
              <div className="feature-item">
                <div className="feature-icon"><IconMessageSquare /></div>
                <div className="feature-text">
                  <h4>Smart Ticketing</h4>
                  <p>Automate, categorize and resolve tickets with AI assistance.</p>
                </div>
              </div>
              <div className="feature-item">
                <div className="feature-icon"><IconBarChart /></div>
                <div className="feature-text">
                  <h4>Real-time Insights</h4>
                  <p>Gain valuable insights with powerful analytics and dashboards.</p>
                </div>
              </div>
              <div className="feature-item">
                <div className="feature-icon"><IconUsers /></div>
                <div className="feature-text">
                  <h4>Team Collaboration</h4>
                  <p>Work together seamlessly and deliver exceptional support.</p>
                </div>
              </div>
            </div>
          </div>
          <div className="left-footer">
            <div className="ai-badge">
              <span className="ai-dot" />
              <span>AI-Powered. Human-Centered. Results-Driven.</span>
            </div>
          </div>
        </div>
      );
    }

    function RoleCard({ id, icon, title, description, selected, onSelect }) {
      return (
        <button id={id} className={`role-card ${selected ? 'selected' : ''}`} onClick={onSelect} aria-pressed={selected} aria-label={title}>
          <span className={`role-check ${selected ? 'show' : ''}`}><IconCheck /></span>
          <div className="role-icon-wrap">{icon}</div>
          <div className="role-title">{title}</div>
          <div className="role-desc">{description}</div>
        </button>
      );
    }

    function LoginForm({ role, onBack }) {
      const [isSignup, setIsSignup] = useState(false);
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [successMsg, setSuccessMsg] = useState('');
      const emailRef = useRef(null);

      useEffect(() => { if (emailRef.current) emailRef.current.focus(); }, [isSignup]);

      const isEmployee = role === 'employee';
      const heading = isSignup ? 'Create Employee Account' : (isEmployee ? 'Welcome Back, Employee' : 'Welcome Back, Admin');
      const loginUrl = isEmployee ? 'http://127.0.0.1:8000/api/employee/auth/login' : 'http://127.0.0.1:8000/api/admin/auth/login';
      const registerUrl = 'http://127.0.0.1:8000/api/employee/auth/register';

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError('');
        setSuccessMsg('');
        
        if (isSignup) {
          if (!name.trim() || !email.trim() || !password) { setError('Please fill in all fields.'); return; }
          setLoading(true);
          try {
            const res = await fetch(registerUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: name.trim(), email: email.trim(), password })
            });
            if (res.ok) {
              setSuccessMsg('Account created successfully! Please log in.');
              setIsSignup(false);
              setPassword('');
            } else {
              let errMsg = 'Failed to create account.';
              try { const data = await res.json(); if (data.detail) errMsg = data.detail; } catch {}
              setError(errMsg);
            }
          } catch { setError('Unable to connect. Please check your connection.'); }
          finally { setLoading(false); }
        } else {
          if (!email.trim() || !password) { setError('Please fill in all fields.'); return; }
          setLoading(true);
          try {
            const formData = new URLSearchParams();
            formData.append('username', email.trim());
            formData.append('password', password);
            const res = await fetch(loginUrl, { 
              method: 'POST', 
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: formData 
            });
            if (res.ok || res.redirected) {
              if (res.redirected) { window.location.href = res.url; }
              else {
                const text = await res.text();
                try {
                  const data = JSON.parse(text);
                  const sessionData = {
                    token: data.access_token,
                    id: data.user?.id,
                    name: data.user?.name,
                    email: data.user?.email,
                    role: data.user?.role
                  };
                  localStorage.setItem('sp_session', JSON.stringify(sessionData));
                  window.location.href = data.redirect || (isEmployee ? './employee/dashboard.html' : './index.html');
                } catch { window.location.href = isEmployee ? './employee/dashboard.html' : './index.html'; }
              }
            } else {
              let errMsg = 'Invalid credentials. Please try again.';
              try { const data = await res.json(); if (data.detail) errMsg = data.detail; } catch {}
              setError(errMsg);
            }
          } catch { setError('Unable to connect. Please check your connection.'); }
          finally { setLoading(false); }
        }
      };

      return (
        <div className="anim-slide-in">
          <div className="form-header">
            <span className="form-title">{heading}</span>
            <button className="back-btn" onClick={() => {
              if (isSignup) { setIsSignup(false); setError(''); setSuccessMsg(''); }
              else onBack();
            }} id="back-to-roles-btn">
              <IconArrowLeft /> {isSignup ? 'Back to login' : 'Back to roles'}
            </button>
          </div>
          {error && (
            <div className="msg msg-error anim-fade-in">
              <IconAlertCircle /> {error}
            </div>
          )}
          {successMsg && (
            <div className="msg msg-success anim-fade-in" style={{ backgroundColor: '#d1fae5', color: '#065f46', padding: '12px', borderRadius: '8px', marginBottom: '16px', display: 'flex', alignItems: 'center', gap: '8px' }}>
              <IconCheck /> {successMsg}
            </div>
          )}
          <form onSubmit={handleSubmit} noValidate>
            {isSignup && (
              <div className="form-group">
                <div className="input-wrapper">
                  <span className="input-icon"><IconUser /></span>
                  <input className="form-input" type="text" placeholder="Full Name"
                    value={name} onChange={e => setName(e.target.value)} required />
                </div>
              </div>
            )}
            <div className="form-group">
              <div className="input-wrapper">
                <span className="input-icon"><IconMail /></span>
                <input ref={emailRef} id="email-input" className="form-input" type="text" placeholder="Email Address"
                  value={email} onChange={e => setEmail(e.target.value)} autoComplete="username" required />
              </div>
            </div>
            <div className="form-group">
              <div className="input-wrapper">
                <span className="input-icon"><IconLock /></span>
                <input id="password-input" className="form-input" type={showPw ? 'text' : 'password'}
                  placeholder="Password" value={password} onChange={e => setPassword(e.target.value)}
                  autoComplete={isSignup ? 'new-password' : 'current-password'} required style={{ paddingRight: '44px' }} />
                <button type="button" className="pw-toggle" onClick={() => setShowPw(v => !v)}
                  aria-label={showPw ? 'Hide password' : 'Show password'}>
                  {showPw ? <IconEyeOff /> : <IconEye />}
                </button>
              </div>
            </div>
            {!isSignup && (
              <div className="forgot-row">
                <button type="button" className="link-btn" id="forgot-password-btn">Forgot Password?</button>
              </div>
            )}
            <button type="submit" className="btn btn-primary" disabled={loading} id="login-submit-btn" style={{ marginTop: isSignup ? '1rem' : '0' }}>
              {loading ? <><span className="spinner" /> {isSignup ? 'Creating Account…' : 'Signing in…'}</> : (isSignup ? 'Sign Up' : 'Login')}
            </button>
          </form>
          {isEmployee && !isSignup && (
            <div className="signup-row">
              Don't have an account?
              <button type="button" className="link-btn" id="signup-btn" onClick={() => { setIsSignup(true); setError(''); setSuccessMsg(''); }}> Sign Up</button>
            </div>
          )}
        </div>
      );
    }

    function AuthCard() {
      const [selectedRole, setSelectedRole] = useState(null);
      const [showForm, setShowForm] = useState(false);

      return (
        <div className="card">
          <div className="card-header">
            <h2 className="card-title">Welcome to SupportPilot</h2>
            <p className="card-subtitle">Choose how you want to continue</p>
          </div>

          <div className="role-grid">
            <RoleCard id="employee-role-card" icon={<IconUser />}
              title="Employee Login" description="Access your support tickets and workspace"
              selected={selectedRole === 'employee'} onSelect={() => setSelectedRole('employee')} />
            <RoleCard id="admin-role-card" icon={<IconShield />}
              title="Admin Login" description="Manage tickets, users, analytics and system settings"
              selected={selectedRole === 'admin'} onSelect={() => setSelectedRole('admin')} />
          </div>

          {selectedRole && (
            <div className="anim-fade-in">
              <div className="divider">or</div>
              {!showForm ? (
                <div className="anim-fade-in">
                  <button className="btn btn-primary" onClick={() => setShowForm(true)} id="continue-btn">
                    Continue as {selectedRole === 'employee' ? 'Employee' : 'Admin'}
                  </button>
                </div>
              ) : (
                <LoginForm role={selectedRole} onBack={() => setShowForm(false)} />
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [theme, setTheme] = useState(() => {
        try { return localStorage.getItem('sp-theme') || 'light'; } catch { return 'light'; }
      });

      useEffect(() => {
        document.documentElement.setAttribute('data-theme', theme);
        try { localStorage.setItem('sp-theme', theme); } catch {}
      }, [theme]);

      return (
        <>
          <ThemeToggle theme={theme} onToggle={setTheme} />
          <div className="page-layout">
            <LeftPanel />
            <div className="right-panel">
              <div className="mobile-brand">
                <div className="mobile-logo-cube"><IconCube /></div>
                <span className="mobile-brand-name">SupportPilot</span>
              </div>
              <div className="auth-wrapper">
                <AuthCard />
                <div className="security-badge">
                  <IconShieldCheck />
                  Secured with enterprise-grade security
                </div>
              </div>
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
